<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Memory · MiniGPT</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0d16; --panel:#11151f; --panel2:#161b28; --line:#232a3a;
  --text:#eef0f5; --dim:#8993a8; --dim2:#5d6579; --purple:#6366f1; --red:#ef4444;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;font-size:14px;
  display:flex;flex-direction:column;height:100vh;overflow:hidden;}
.app-grid{flex:1;min-height:0;display:grid;grid-template-columns:264px 1fr;overflow:hidden;}
::-webkit-scrollbar{width:6px;} ::-webkit-scrollbar-thumb{background:var(--line);border-radius:3px;}
.mini-bar{height:64px;flex:none;background:var(--panel);border-top:1px solid var(--line);
  display:flex;align-items:center;gap:14px;padding:0 20px;}
.mini-bar.empty{opacity:.6;}
.mini-art{width:40px;height:40px;border-radius:9px;background:linear-gradient(135deg,#4c3a7a,#1e3a5f);
  background-size:cover;background-position:center;flex:none;}
.mini-info{width:170px;flex:none;overflow:hidden;}
.mini-title{font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.mini-artist{font-size:11px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.mini-controls{flex:1;display:flex;align-items:center;gap:10px;}
.mini-time{font-size:10.5px;color:var(--dim2);width:32px;flex:none;text-align:center;}
.mini-controls input[type=range]{-webkit-appearance:none;flex:1;height:4px;border-radius:2px;background:var(--line);outline:none;}
.mini-controls input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;border-radius:50%;background:var(--purple);cursor:pointer;}
.mini-controls input[type=range]:disabled::-webkit-slider-thumb{background:var(--dim2);}
#miniPlayBtn{width:36px;height:36px;border-radius:50%;background:var(--purple);border:none;color:#fff;font-size:14px;cursor:pointer;flex:none;}
#miniPlayBtn:disabled{background:var(--panel2);color:var(--dim2);cursor:not-allowed;}
#sidebar{background:var(--panel);border-right:1px solid var(--line);padding:22px 16px;
  display:flex;flex-direction:column;gap:22px;overflow-y:auto;}
.brand{display:flex;align-items:center;gap:10px;padding:0 4px;}
.brand .logo{width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,#818cf8,#6366f1);
  display:flex;align-items:center;justify-content:center;font-size:18px;}
.brand h1{font-size:16px;font-weight:700;} .brand p{font-size:11px;color:var(--dim);}
nav{display:flex;flex-direction:column;gap:2px;}
nav a{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;
  color:var(--dim);text-decoration:none;font-weight:500;font-size:13.5px;}
nav a .ic{width:18px;text-align:center;}
nav a.active{background:var(--purple);color:#fff;}
nav a:hover:not(.active){background:var(--panel2);color:var(--text);}
#main{display:flex;flex-direction:column;min-width:0;overflow-y:auto;}
#top{padding:20px 28px;border-bottom:1px solid var(--line);}
#top h2{font-size:21px;font-weight:700;} #top p{font-size:12.5px;color:var(--dim);margin-top:2px;}
#content{padding:28px;max-width:640px;display:flex;flex-direction:column;gap:20px;}
.addrow{display:flex;gap:10px;}
.addrow input{flex:1;background:var(--panel2);border:1px solid var(--line);border-radius:12px;
  padding:11px 14px;color:var(--text);font-size:13.5px;}
.addrow button{all:unset;background:var(--purple);color:#fff;padding:11px 18px;border-radius:12px;
  font-size:13px;font-weight:600;cursor:pointer;}
.mem-row{display:flex;gap:12px;align-items:center;background:var(--panel2);border:1px solid var(--line);
  border-radius:12px;padding:12px 14px;}
.mem-row .ic{width:30px;height:30px;border-radius:9px;background:var(--bg);flex:none;
  display:flex;align-items:center;justify-content:center;font-size:13px;}
.mem-row .t{font-size:13px;flex:1;}
.mem-row .del{all:unset;color:var(--dim2);cursor:pointer;font-size:13px;padding:4px 8px;}
.mem-row .del:hover{color:var(--red);}
.empty{font-size:13px;color:var(--dim2);padding:20px;text-align:center;background:var(--panel2);
  border:1px dashed var(--line);border-radius:12px;}
</style>
</head>
<body>
<div class="app-grid">
<div id="sidebar">
  <div class="brand"><div class="logo">🧠</div><div><h1>MiniGPT</h1><p>Your AI Companion</p></div></div>
  <nav>
    <a href="index.html"><span class="ic">💬</span>Chat</a>
    <a href="music.html"><span class="ic">🎵</span>Music</a>
    <a href="memory.html" class="active"><span class="ic">🧠</span>Memory</a>
    <a href="modes.html"><span class="ic">▦</span>Modes</a>
    <a href="tools.html"><span class="ic">🔧</span>Tools</a>
    <a href="settings.html"><span class="ic">⚙</span>Settings</a>
  </nav>
</div>

<div id="main">
  <div id="top"><h2>Memory</h2><p>Things MiniGPT has remembered about you from your conversations.</p></div>
  <div id="content">
    <div class="addrow">
      <input id="newMem" placeholder="Add something for MiniGPT to remember…">
      <button id="addBtn">Add</button>
    </div>
    <div id="memList"></div>
  </div>
</div>
</div>

<div class="mini-bar empty" id="miniPlayerBar">
  <div class="mini-art" id="miniArt"></div>
  <div class="mini-info">
    <div class="mini-title" id="miniTitle">Nothing playing</div>
    <div class="mini-artist" id="miniArtist">Go to Music to search a song</div>
  </div>
  <div class="mini-controls">
    <span class="mini-time" id="miniCur">0:00</span>
    <input type="range" id="miniSeek" min="0" max="100" value="0" disabled>
    <span class="mini-time" id="miniDur">0:00</span>
  </div>
  <button id="miniPlayBtn" disabled>▶</button>
</div>
<audio id="miniAudio" preload="none"></audio>
<script src="player.js"></script>

<script>
function getUsername(){ return localStorage.getItem('mg_username') || ''; }
if(!getUsername()){ location.href = 'welcome.html'; }
function getMemory(){ return JSON.parse(localStorage.getItem('mg_memory') || '[]'); }
function saveMemory(arr){ localStorage.setItem('mg_memory', JSON.stringify(arr)); render(); }

function render(){
  const list = getMemory();
  const el = document.getElementById('memList');
  el.innerHTML = list.length ? list.map((m,i)=>`
    <div class="mem-row">
      <div class="ic">${m.icon}</div>
      <div class="t">${m.text}</div>
      <button class="del" data-i="${i}">✕</button>
    </div>`).join('') : `<div class="empty">No memories yet — chat with MiniGPT and it'll start remembering things here.</div>`;
  document.querySelectorAll('.del').forEach(btn=>{
    btn.onclick = () => {
      const arr = getMemory();
      arr.splice(parseInt(btn.dataset.i), 1);
      saveMemory(arr);
    };
  });
}
document.getElementById('addBtn').onclick = () => {
  const input = document.getElementById('newMem');
  const val = input.value.trim();
  if(!val) return;
  const arr = getMemory();
  arr.unshift({icon:'✦', text: val});
  saveMemory(arr);
  input.value = '';
};
document.getElementById('newMem').addEventListener('keydown', e=>{ if(e.key==='Enter') document.getElementById('addBtn').click(); });
render();
</script>
</body>
</html>

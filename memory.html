<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Memory · MiniGPT</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="shared.css">
  <style>
    #content {
      padding: 28px;
      max-width: 640px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .addrow {
      display: flex;
      gap: 10px;
    }

    .addrow input {
      flex: 1;
      background: var(--panel2);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 11px 14px;
      color: var(--text);
      font-size: 13.5px;
    }

    .addrow button {
      all: unset;
      background: var(--purple);
      color: #fff;
      padding: 11px 18px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }

    .mem-row {
      display: flex;
      gap: 12px;
      align-items: center;
      background: var(--panel2);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 12px 14px;
    }

    .mem-row .ic {
      width: 30px;
      height: 30px;
      border-radius: 9px;
      background: var(--bg);
      flex: none;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
    }

    .mem-row .t {
      font-size: 13px;
      flex: 1;
    }

    .mem-row .del {
      all: unset;
      color: var(--dim2);
      cursor: pointer;
      font-size: 13px;
      padding: 4px 8px;
    }

    .mem-row .del:hover {
      color: var(--red);
    }

    .empty {
      font-size: 13px;
      color: var(--dim2);
      padding: 20px;
      text-align: center;
      background: var(--panel2);
      border: 1px dashed var(--line);
      border-radius: 12px;
    }
  </style>
</head>

<body>
  <div class="app-grid">
    <div id="sidebar">
      <div class="brand">
        <div class="logo">🧠</div>
        <div>
          <h1>MiniGPT</h1>
          <p>Your AI Companion</p>
        </div>
      </div>
      <nav>
        <a href="index.html"><span class="ic">💬</span>Chat</a>
        <a href="music.html"><span class="ic">🎵</span>Music</a>
        <a href="memory.html" class="active"><span class="ic">🧠</span>Memory</a>
        <a href="modes.html"><span class="ic">▦</span>Modes</a>
        <a href="tools.html"><span class="ic">🔧</span>Tools</a>
        <a href="settings.html"><span class="ic">⚙</span>Settings</a>
      </nav>
    </div>

    <div id="main">
      <div id="top">
        <h2>Memory</h2>
        <p>Things MiniGPT has remembered about you from your conversations.</p>
      </div>
      <div id="content">
        <div class="addrow">
          <input id="newMem" placeholder="Add something for MiniGPT to remember…">
          <button id="addBtn">Add</button>
        </div>
        <div id="memList"></div>
      </div>
    </div>
  </div>

  <script src="player.js"></script>

  <script>
    function getUsername() { return localStorage.getItem('mg_username') || ''; }
    if (!getUsername()) { location.href = 'welcome.html'; }
    function getMemory() { return JSON.parse(localStorage.getItem('mg_memory') || '[]'); }
    function saveMemory(arr) { localStorage.setItem('mg_memory', JSON.stringify(arr)); render(); }

    function render() {
      const list = getMemory();
      const el = document.getElementById('memList');
      el.innerHTML = list.length ? list.map((m, i) => `
    <div class="mem-row">
      <div class="ic">${m.icon}</div>
      <div class="t">${m.text}</div>
      <button class="del" data-i="${i}">✕</button>
    </div>`).join('') : `<div class="empty">No memories yet — chat with MiniGPT and it'll start remembering things here.</div>`;
      document.querySelectorAll('.del').forEach(btn => {
        btn.onclick = () => {
          const arr = getMemory();
          arr.splice(parseInt(btn.dataset.i), 1);
          saveMemory(arr);
        };
      });
    }
    document.getElementById('addBtn').onclick = () => {
      const input = document.getElementById('newMem');
      const val = input.value.trim();
      if (!val) return;
      const arr = getMemory();
      arr.unshift({ icon: '✦', text: val });
      saveMemory(arr);
      input.value = '';
    };
    document.getElementById('newMem').addEventListener('keydown', e => { if (e.key === 'Enter') document.getElementById('addBtn').click(); });
    render();
  </script>
</body>

</html>

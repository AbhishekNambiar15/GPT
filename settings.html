<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Settings · MiniGPT</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="shared.css">
  <style>
    #content {
      padding: 28px;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .card {
      background: var(--panel2);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 20px;
    }

    .card h3 {
      font-size: 14px;
      font-weight: 700;
      margin-bottom: 4px;
    }

    .card p {
      font-size: 12px;
      color: var(--dim);
      margin-bottom: 14px;
    }

    .row {
      display: flex;
      gap: 10px;
    }

    input {
      flex: 1;
      background: var(--bg);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 11px 14px;
      color: var(--text);
      font-size: 13.5px;
    }

    button {
      all: unset;
      background: var(--purple);
      color: #fff;
      padding: 11px 18px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
    }

    button.danger {
      background: transparent;
      border: 1px solid var(--red);
      color: var(--red);
      width: 100%;
      box-sizing: border-box;
    }

    .saved {
      font-size: 12px;
      color: #22c55e;
      height: 16px;
      margin-top: 8px;
    }
  </style>
</head>

<body>
  <div class="app-grid">
    <div id="sidebar">
      <div class="brand">
        <div class="logo">🧠</div>
        <div>
          <h1>MiniGPT</h1>
          <p>Your AI Companion</p>
        </div>
      </div>
      <nav>
        <a href="index.html"><span class="ic">💬</span>Chat</a>
        <a href="music.html"><span class="ic">🎵</span>Music</a>
        <a href="memory.html"><span class="ic">🧠</span>Memory</a>
        <a href="modes.html"><span class="ic">▦</span>Modes</a>
        <a href="tools.html"><span class="ic">🔧</span>Tools</a>
        <a href="settings.html" class="active"><span class="ic">⚙</span>Settings</a>
      </nav>
    </div>

    <div id="main">
      <div id="top">
        <h2>Settings</h2>
        <p>Manage your profile and data.</p>
      </div>
      <div id="content">
        <div class="card">
          <h3>Your name</h3>
          <p>This is how MiniGPT greets you.</p>
          <div class="row"><input id="nameInput"><button id="saveName">Save</button></div>
          <div class="saved" id="savedMsg"></div>
        </div>
        <div class="card">
          <h3>Reset data</h3>
          <p>Clears your name, activity log, memories and mode. You'll be asked for your name again.</p>
          <button class="danger" id="resetBtn">Clear all data</button>
        </div>
      </div>
    </div>
  </div>

  <script src="player.js"></script>

  <script>
    function getUsername() { return localStorage.getItem('mg_username') || ''; }
    if (!getUsername()) { location.href = 'welcome.html'; }
    document.getElementById('nameInput').value = getUsername();

    document.getElementById('saveName').onclick = () => {
      const val = document.getElementById('nameInput').value.trim();
      if (!val) return;
      localStorage.setItem('mg_username', val);
      document.getElementById('savedMsg').textContent = 'Saved!';
      setTimeout(() => { document.getElementById('savedMsg').textContent = ''; }, 1500);
    };

    document.getElementById('resetBtn').onclick = () => {
      if (confirm('This will clear your name, activity, memory and mode. Continue?')) {
        localStorage.removeItem('mg_username');
        localStorage.removeItem('mg_activity');
        localStorage.removeItem('mg_memory');
        localStorage.removeItem('mg_mode');
        location.href = 'welcome.html';
      }
    };
  </script>
</body>

</html>

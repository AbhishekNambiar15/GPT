<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Modes · MiniGPT</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="shared.css">
  <style>
    #content {
      padding: 28px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      max-width: 760px;
    }

    .mode {
      background: var(--panel2);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 20px;
      cursor: pointer;
    }

    .mode:hover {
      border-color: var(--purple);
    }

    .mode.selected {
      border-color: var(--purple);
      box-shadow: 0 0 0 1px var(--purple);
    }

    .mode .ic {
      width: 40px;
      height: 40px;
      border-radius: 11px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      margin-bottom: 12px;
    }

    .mode .t {
      font-weight: 700;
      font-size: 14.5px;
      margin-bottom: 4px;
    }

    .mode .s {
      font-size: 12px;
      color: var(--dim);
    }

    .mode .badge {
      display: none;
      font-size: 10.5px;
      color: var(--purple);
      font-weight: 600;
      margin-top: 10px;
    }

    .mode.selected .badge {
      display: block;
    }
  </style>
</head>

<body>
  <div class="app-grid">
    <div id="sidebar">
      <div class="brand">
        <div class="logo">🧠</div>
        <div>
          <h1>MiniGPT</h1>
          <p>Your AI Companion</p>
        </div>
      </div>
      <nav>
        <a href="index.html"><span class="ic">💬</span>Chat</a>
        <a href="music.html"><span class="ic">🎵</span>Music</a>
        <a href="memory.html"><span class="ic">🧠</span>Memory</a>
        <a href="modes.html" class="active"><span class="ic">▦</span>Modes</a>
        <a href="tools.html"><span class="ic">🔧</span>Tools</a>
        <a href="settings.html"><span class="ic">⚙</span>Settings</a>
      </nav>
    </div>

    <div id="main">
      <div id="top">
        <h2>Modes</h2>
        <p>Choose how you'd like MiniGPT to behave right now.</p>
      </div>
      <div id="content"></div>
    </div>
  </div>

  <script src="player.js"></script>

  <script>
    function getUsername() { return localStorage.getItem('mg_username') || ''; }
    if (!getUsername()) { location.href = 'welcome.html'; }
    function addActivity(icon, text) {
      const arr = JSON.parse(localStorage.getItem('mg_activity') || '[]');
      arr.unshift({ icon, text, time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) });
      localStorage.setItem('mg_activity', JSON.stringify(arr.slice(0, 20)));
    }
    function getMode() { return localStorage.getItem('mg_mode') || 'Study Mode'; }

    const MODES = [
      { name: 'Study Mode', icon: '📗', bg: '#16412c', color: '#22c55e', desc: 'Focus · Learn · Grow' },
      { name: 'Work Mode', icon: '💼', bg: '#1e3a5f', color: '#60a5fa', desc: 'Tasks · Deadlines · Output' },
      { name: 'Creative Mode', icon: '🎨', bg: '#4c1d5f', color: '#e879f9', desc: 'Brainstorm · Explore · Play' },
      { name: 'Relax Mode', icon: '🌙', bg: '#312e5f', color: '#a5b4fc', desc: 'Unwind · Chat · Slow down' }
    ];

    function render() {
      const current = getMode();
      const el = document.getElementById('content');
      el.innerHTML = MODES.map(m => `
    <div class="mode ${m.name === current ? 'selected' : ''}" data-name="${m.name}">
      <div class="ic" style="background:${m.bg};color:${m.color};">${m.icon}</div>
      <div class="t">${m.name}</div>
      <div class="s">${m.desc}</div>
      <div class="badge">✓ Active</div>
    </div>`).join('');
      document.querySelectorAll('.mode').forEach(card => {
        card.onclick = () => {
          localStorage.setItem('mg_mode', card.dataset.name);
          addActivity('▦', `Switched to ${card.dataset.name}`);
          render();
        };
      });
    }
    render();
  </script>
</body>

</html>

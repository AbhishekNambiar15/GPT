<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>MiniGPT</title>
    <link rel="stylesheet" href="shared.css">
    <style>
        * {
            box-sizing: border-box
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            position: relative;
        }

        body {
            overflow: hidden;
            background: #0a0d16
        }

        #contentFrame,
        #musicFrame {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            margin: 0;
            border: 0;
        }

        /* Never display:none the music frame — that suspends the <audio>
           element and the embedded YouTube player inside it, which is
           exactly what stops music from playing while you browse other
           pages. Instead, the inactive frame stays rendered (so its media
           keeps playing) but is pushed behind and made non-interactive. */
        .frame-hidden {
            opacity: 0;
            pointer-events: none;
            z-index: 0;
        }

        .frame-visible {
            opacity: 1;
            z-index: 1;
        }
    </style>
</head>

<body>
    <iframe id="contentFrame" class="frame-visible" src="index.html" title="MiniGPT application"></iframe>
    <iframe id="musicFrame" class="frame-hidden" src="music.html" title="MiniGPT music player"></iframe>
    <script>
        const contentFrame = document.getElementById('contentFrame');
        const musicFrame = document.getElementById('musicFrame');
        const allowedPages = new Set(['index.html', 'memory.html', 'modes.html', 'tools.html', 'settings.html', 'welcome.html']);

        function showPage(page) {
            if (page === 'music.html') {
                contentFrame.classList.remove('frame-visible');
                contentFrame.classList.add('frame-hidden');
                musicFrame.classList.remove('frame-hidden');
                musicFrame.classList.add('frame-visible');
                return;
            }
            if (!allowedPages.has(page)) return;
            musicFrame.classList.remove('frame-visible');
            musicFrame.classList.add('frame-hidden');
            contentFrame.classList.remove('frame-hidden');
            contentFrame.classList.add('frame-visible');
            if (contentFrame.contentWindow.location.pathname.endsWith('/' + page)) return;
            contentFrame.src = page;
        }

        window.addEventListener('message', event => {
            if (event.origin !== location.origin) return;
            if (!event.data) return;
            if (event.data.type === 'navigate') showPage(event.data.page);
            if (event.data.type === 'player-command') {
                musicFrame.contentWindow.postMessage(event.data, location.origin);
            }
            if (event.data.type === 'player-state') {
                contentFrame.contentWindow.postMessage(event.data, location.origin);
            }
        });
    </script>
</body>

</html>

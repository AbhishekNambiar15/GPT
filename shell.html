<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>MiniGPT</title>
    <link rel="stylesheet" href="shared.css">
    <style>
        * {
            box-sizing: border-box
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            position: relative;
        }

        body {
            overflow: hidden;
            background: #0a0d16
        }

        #contentFrame,
        #musicFrame {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            margin: 0;
            border: 0;
        }

        /* Never display:none the music frame — that suspends the <audio>
           element and the embedded YouTube player inside it, which is
           exactly what stops music from playing while you browse other
           pages. Instead, the inactive frame stays rendered (so its media
           keeps playing) but is pushed behind and made non-interactive. */
        .frame-hidden {
            opacity: 0;
            pointer-events: none;
            z-index: 0;
        }

        .frame-visible {
            opacity: 1;
            z-index: 1;
        }

        /* Index page only: the music frame is shrunk and floated over the
           video slot in the Chat page's music card (same single player, so
           audio never restarts). Positioned/clipped via inline styles. */
        .frame-slot {
            opacity: 1;
            z-index: 3;
            border-radius: 10px;
        }
    </style>
</head>

<body>
    <iframe id="contentFrame" class="frame-visible" src="index.html" title="MiniGPT application"></iframe>
    <iframe id="musicFrame" class="frame-hidden" src="music.html" title="MiniGPT music player"></iframe>
    <script>
        const contentFrame = document.getElementById('contentFrame');
        const musicFrame = document.getElementById('musicFrame');
        const allowedPages = new Set(['index.html', 'memory.html', 'modes.html', 'tools.html', 'settings.html', 'welcome.html']);

        let currentPage = 'index.html';

        function clearSlot() {
            if (!musicFrame.classList.contains('frame-slot')) return;
            musicFrame.removeAttribute('style');
            musicFrame.classList.remove('frame-slot');
            musicFrame.classList.add('frame-hidden');
            musicFrame.contentWindow.postMessage({ type: 'video-slot-mode', on: false }, location.origin);
        }

        function applySlot(slot) {
            if (currentPage !== 'index.html' || !slot || !slot.visible) { clearSlot(); return; }
            const r = slot.rect, c = slot.clip;
            musicFrame.classList.remove('frame-hidden', 'frame-visible');
            musicFrame.classList.add('frame-slot');
            Object.assign(musicFrame.style, {
                inset: 'auto',
                left: r.left + 'px', top: r.top + 'px',
                width: r.width + 'px', height: r.height + 'px',
                clipPath: `inset(${c.top}px ${c.right}px ${c.bottom}px ${c.left}px round 10px)`
            });
            musicFrame.contentWindow.postMessage({ type: 'video-slot-mode', on: true }, location.origin);
        }

        // If the music page finishes loading after a slot was already applied
        // (e.g. a refresh while a video is playing), re-send the mode to it.
        musicFrame.addEventListener('load', () => {
            musicFrame.contentWindow.postMessage(
                { type: 'video-slot-mode', on: musicFrame.classList.contains('frame-slot') }, location.origin);
        });

        function showPage(page) {
            if (allowedPages.has(page) || page === 'music.html') currentPage = page;
            clearSlot();
            if (page === 'music.html') {
                contentFrame.classList.remove('frame-visible');
                contentFrame.classList.add('frame-hidden');
                musicFrame.classList.remove('frame-hidden');
                musicFrame.classList.add('frame-visible');
                return;
            }
            if (!allowedPages.has(page)) return;
            musicFrame.classList.remove('frame-visible');
            musicFrame.classList.add('frame-hidden');
            contentFrame.classList.remove('frame-hidden');
            contentFrame.classList.add('frame-visible');
            if (contentFrame.contentWindow.location.pathname.endsWith('/' + page)) {
                // Already loaded: ask the Chat page to re-report its video slot.
                if (page === 'index.html') contentFrame.contentWindow.postMessage({ type: 'video-slot-request' }, location.origin);
                return;
            }
            contentFrame.src = page;
        }

        window.addEventListener('message', event => {
            if (event.origin !== location.origin) return;
            if (!event.data) return;
            if (event.data.type === 'navigate') showPage(event.data.page);
            if (event.data.type === 'player-command') {
                musicFrame.contentWindow.postMessage(event.data, location.origin);
            }
            if (event.data.type === 'player-state') {
                contentFrame.contentWindow.postMessage(event.data, location.origin);
            }
            if (event.data.type === 'video-slot' && event.source === contentFrame.contentWindow) {
                applySlot(event.data);
            }
        });
    </script>
</body>

</html>
